name: Job alerts

on:
  schedule:
    # Every 10 minutes, offset from :00 because GitHub drops many top-of-the-hour runs.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test message instead of checking jobs"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Send test message
        if: ${{ inputs.test_message }}
        run: python3 job_alerts.py --test-message

      - name: Check for new jobs
        if: ${{ !inputs.test_message }}
        run: python3 job_alerts.py

      - name: Save which jobs were already sent
        if: ${{ !inputs.test_message }}
        run: |
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update seen jobs"
            git push
          fi
